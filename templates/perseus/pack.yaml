# SEEDED ONCE from engineering-standards. Optional seed. Delete if unused.
# Not required by a standards sync. Copy to .perseus/pack.yaml only if the
# host has Perseus, then edit.
version: 1
name: <PROJECT>
profile: generic
trust_profile: balanced
renders:
  - name: default
    source: .perseus/context.md
    output: live-context.md
    assistant: generic
synthesis:
  - name: project-status
    question: What is the current project status and next allowable action?
    sources:
      - ROADMAP.md
      - HANDOFF.md
      - README.md
    enabled: false
