name: standards-sync

# COPY THIS FILE INTO EACH CONSUMING REPOSITORY, alongside a vendored standards/ directory.
#
# It opens a pull request when the local standards/ falls behind upstream. It NEVER
# auto-merges, and it NEVER touches anything outside standards/ - the sync script enforces
# that second guarantee itself, by refusing to write outside the directory.
#
# The sync script is fetched from upstream at run time rather than vendored, so a fix to the
# script reaches every consuming repository without needing its own sync.

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is deliberate: drift is not urgent, and a daily PR that
    # nobody reads is a notification people learn to dismiss.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to sync from
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: RichardvZyl/engineering-standards
  # Each version gets its own branch, <prefix>-<version>, pushed once and never rewritten:
  # standard 03 prohibits rewriting published history, bot-owned branches included. A hyphen,
  # not a slash: a leftover branch named <prefix> would make <prefix>/<version> unpushable.
  SYNC_BRANCH_PREFIX: standards-sync
# One sync at a time per repository, so two runs cannot both create the same version's branch
# and pull request. GitHub keeps only the newest pending run per group; a manual dispatch
# replaced while waiting must be re-dispatched.
concurrency:
  group: standards-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Build from the default branch even on a manual dispatch from another branch, so the
          # sync PR never carries that branch's unrelated commits.
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch the sync script from upstream
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          curl -fsSL \
            "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${REF}/scripts/Sync-Standards.ps1" \
            -o /tmp/Sync-Standards.ps1
          test -s /tmp/Sync-Standards.ps1

      - name: Mirror standards/
        id: sync
        shell: pwsh
        run: |
          $ref = if ('${{ github.event.inputs.ref }}') { '${{ github.event.inputs.ref }}' } else { 'main' }
          /tmp/Sync-Standards.ps1 `
            -UpstreamRepo $env:UPSTREAM_REPO `
            -Ref $ref `
            -RepositoryRoot . `
            -Confirm:$false | Out-Null

      - name: Open or update the pull request
        if: steps.sync.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_VERSION: ${{ steps.sync.outputs.from_version }}
          TO_VERSION: ${{ steps.sync.outputs.to_version }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SYNC_BRANCH="${SYNC_BRANCH_PREFIX}-${TO_VERSION}"
          TITLE="Standards sync: ${FROM_VERSION} → ${TO_VERSION}"

          # Only standards/ is staged. Even if something else were dirty, it does not travel.
          git add standards/

          if git diff --cached --quiet; then
            echo "Nothing staged under standards/. Stopping."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" > /dev/null; then
            # An earlier run pushed this version. Reuse the branch as it is; never rewrite it.
            git fetch --no-tags --depth=1 origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
            if ! git diff --cached --quiet "origin/${SYNC_BRANCH}" -- standards/; then
              echo "::error::${SYNC_BRANCH} already exists with different standards/ content. Upstream changed standards/ without bumping standards/VERSION; fix it upstream."
              exit 1
            fi
            echo "${SYNC_BRANCH} already carries this sync."
          else
            git checkout -b "$SYNC_BRANCH"
            git commit -m "$TITLE" -m "$SUMMARY"
            git push origin "$SYNC_BRANCH"
          fi

          BODY=$(cat <<EOF
          Vendored \`standards/\` has fallen behind \`${UPSTREAM_REPO}\`.

          **${FROM_VERSION} → ${TO_VERSION}**

          ${SUMMARY}

          ---

          This PR touches nothing outside \`standards/\`, and nothing here was written by hand.

          - **Agreeing?** Merge it.
          - **Disagreeing with a rule?** Do not edit it here — a local edit is drift the next
            sync will fight. Change it upstream in \`${UPSTREAM_REPO}\` and let the next sync
            carry it everywhere.
          - **This repository departs from a standard deliberately?** Record the departure in
            \`AGENTS.md\` with a link to the ADR, then merge.
          EOF
          )

          # Same-repository PRs only: a fork PR can share the branch name and must not count.
          # A closed PR for this version counts too: a person closed it, and the next weekly run
          # must not reopen the question.
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state all --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already covers ${SYNC_BRANCH}."
          else
            gh pr create --head "$SYNC_BRANCH" --title "$TITLE" --body "$BODY"
            echo "Opened a new PR."
          fi

          # An open sync PR for an older version is superseded: close it, and keep its branch.
          # A newer version's PR is left alone, so dispatching an older ref cannot close it. Only
          # plain MAJOR.MINOR.PATCH versions are compared; any other branch name is left alone.
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+$'
          CURRENT=$(gh pr list --head "$SYNC_BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -n "$CURRENT" ] && [[ "$TO_VERSION" =~ $SEMVER ]]; then
            gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository \
              --jq ".[] | select(.isCrossRepository | not) | select(.headRefName == \"${SYNC_BRANCH_PREFIX}\" or (.headRefName | startswith(\"${SYNC_BRANCH_PREFIX}-\"))) | select(.headRefName != \"${SYNC_BRANCH}\") | \"\(.number) \(.headRefName)\"" |
              while read -r OLD OLD_BRANCH; do
                OLD_VERSION="${OLD_BRANCH#"${SYNC_BRANCH_PREFIX}"}"
                OLD_VERSION="${OLD_VERSION#-}"
                if [ -n "$OLD_VERSION" ] && ! [[ "$OLD_VERSION" =~ $SEMVER ]]; then
                  continue
                fi
                NEWER=$(printf '%s\n%s\n' "$OLD_VERSION" "$TO_VERSION" | sort -V | tail -n 1)
                if [ -n "$OLD_VERSION" ] && [ "$NEWER" = "$OLD_VERSION" ]; then
                  echo "Leaving PR #${OLD} open: ${OLD_VERSION} is newer than ${TO_VERSION}."
                  continue
                fi
                gh pr close "$OLD" --comment "Superseded by #${CURRENT} (standards ${TO_VERSION})."
                echo "Closed superseded PR #${OLD}."
              done
          fi

      - name: Report no drift
        if: steps.sync.outputs.has_drift != 'true'
        run: echo "standards/ is current at ${{ steps.sync.outputs.to_version }}. No PR needed."